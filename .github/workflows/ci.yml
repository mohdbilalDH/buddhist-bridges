name: CI and Pages deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild V2 CSVs from source modules
        run: python3 build_dataset.py
      - name: Verify frozen V3.0 manifest and regenerate web exports
        run: |
          cd buddhist-bridges
          python3 analysis/export_web.py

  build-site:
    runs-on: ubuntu-latest
    needs: validate-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: buddhist-bridges/site/package-lock.json
      - name: Build
        env:
          ASTRO_BASE: /${{ github.event.repository.name }}
          ASTRO_SITE: https://${{ github.repository_owner }}.github.io
        run: |
          cd buddhist-bridges/site
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: buddhist-bridges/site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
